<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BABRN Turbo Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .safe-area-top { padding-top: env(safe-area-inset-top); background: #0f172a; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); background: white; }
        .mobile-canvas { font-size: 16px; line-height: 1.6; border: none; resize: none; width: 100%; height: 100%; flex: 1; outline: none; padding: 20px; font-family: 'Courier New', monospace; }
        .btn-active { color: #10b981 !important; border-top: 3px solid #10b981; }
        .hidden { display: none !important; }
        button { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    </style>
</head>
<body>

    <div class="safe-area-top shadow-lg">
        <header class="p-4 flex justify-between items-center text-white">
            <div>
                <h1 class="text-lg font-bold tracking-tight text-emerald-400">BABRN <span class="text-white font-light">TURBO</span></h1>
                <div id="recording-status" class="hidden flex items-center gap-1 text-[10px] font-bold text-red-500 animate-pulse">
                    <i class="fas fa-circle"></i> LIVE
                </div>
            </div>
            <div id="timer-box" class="hidden bg-slate-800 px-3 py-1 rounded-full font-mono text-emerald-400 text-sm">00:00:00</div>
        </header>
    </div>

    <main id="view-editor" class="flex-1 flex flex-col bg-white overflow-hidden">
        <div class="px-2 py-2 bg-slate-50 border-b flex gap-2 overflow-x-auto whitespace-nowrap no-scrollbar shadow-sm">
            <button onclick="syncToGoogleCloud()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-md">
                <i class="fas fa-cloud-upload-alt mr-1"></i> CLOUD SYNC
            </button>
            <button onclick="exportToWord()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-md">
                <i class="fas fa-file-word mr-1"></i> MS WORD
            </button>
            <button onclick="generateMoMSummary()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold">MOM</button>
            <button onclick="cleanupText()" class="bg-white border px-3 py-2 rounded-lg text-xs font-bold text-slate-600">CLEAN</button>
        </div>
        
        <input type="text" id="session-title" placeholder="MEETING TITLE..." class="p-4 font-bold text-slate-700 bg-emerald-50/30 outline-none border-b uppercase tracking-tighter">
        <textarea id="output" class="mobile-canvas" placeholder="Tap START to transcribe Taglish/English..."></textarea>
        
        <div class="p-4 flex gap-3 bg-white border-t shadow-inner">
            <button id="start-btn" class="flex-1 bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest text-sm">Start Capture</button>
            <button id="stop-btn" class="hidden flex-1 bg-red-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest text-sm">Stop & Save</button>
        </div>
    </main>

    <main id="view-archives" class="flex-1 hidden bg-slate-100 overflow-y-auto p-4">
        <div id="library-list" class="space-y-3"></div>
    </main>

    <nav class="safe-area-bottom border-t flex justify-around items-center">
        <button onclick="switchTab('editor')" id="nav-editor" class="flex-1 py-3 text-slate-400 text-xs font-bold btn-active">
            <i class="fas fa-keyboard text-lg block mb-1"></i> RECORDER
        </button>
        <button onclick="switchTab('archives')" id="nav-archives" class="flex-1 py-3 text-slate-400 text-xs font-bold">
            <i class="fas fa-folder-open text-lg block mb-1"></i> ARCHIVES
        </button>
    </nav>

    <script>
        let db, mediaRecorder, chunks = [], finalTranscript = "", currentEntryId = null;
        let isRecording = false, timerInterval, startTime, wakeLock = null;

        // INDEXED DB SETUP
        const request = indexedDB.open("BABRN_Turbo_V1", 1);
        request.onupgradeneeded = e => e.target.result.createObjectStore("sessions", { keyPath: "id" });
        request.onsuccess = e => db = e.target.result;

        const output = document.getElementById('output');
        const sessionTitle = document.getElementById('session-title');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const timerBox = document.getElementById('timer-box');

        // PREVENT SCREEN SLEEP
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } 
            catch (err) { console.log("WakeLock Disabled"); }
        }

        // GOOGLE CLOUD SYNC (Using your provided URL)
        async function syncToGoogleCloud() {
            const scriptURL = 'https://script.google.com/macros/s/AKfycby6ZIAuBnLUogVY6UxY-4TNb3Zy7iRCVi56UtpfkLg79LXbiTo97PnroSo96lvBS3FF/exec';
            const data = {
                title: sessionTitle.value || "Untitled_Meeting",
                content: output.value,
                date: new Date().toLocaleString()
            };

            if(!data.content) return alert("Nothing to sync!");

            try {
                // Sent to your Google App Script
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                alert("☁️ Synced to Google Drive!");
            } catch (e) { alert("Sync failed. Check connection."); }
        }

        // MS WORD EXPORT WITH TABLE
        function exportToWord() {
            const title = sessionTitle.value || "Meeting_Notes";
            const content = output.value;
            const html = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><style>
                    body { font-family: 'Calibri', sans-serif; }
                    .h1 { color: #10b981; font-size: 20pt; font-weight: bold; }
                    table { border-collapse: collapse; width: 100%; border: 1px solid #ddd; }
                    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
                </style></head>
                <body>
                    <div class="h1">${title.toUpperCase()}</div>
                    <p>Date: ${new Date().toLocaleString()}</p>
                    <hr>
                    <h3>ACTION ITEMS</h3>
                    <table><tr><th>Task</th><th>Assignee</th><th>Status</th></tr><tr><td>-</td><td></td><td></td></tr></table>
                    <h3>TRANSCRIPT</h3>
                    <p>${content.replace(/\n/g, '<br>')}</p>
                </body></html>`;

            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `${title}.doc`; a.click();
        }

        // SPEECH ENGINE (Optimized for Taglish fil-PH)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'fil-PH';

        startBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => saveToDB(new Blob(chunks, { type: 'audio/webm' }));
                
                mediaRecorder.start();
                recognition.start();
                await requestWakeLock();
                
                isRecording = true;
                startTime = Date.now();
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                document.getElementById('recording-status').classList.remove('hidden');
                timerBox.classList.remove('hidden');
                
                timerInterval = setInterval(updateTimer, 1000);
            } catch(e) { alert("Please allow microphone access."); }
        };

        stopBtn.onclick = () => {
            isRecording = false;
            mediaRecorder.stop();
            recognition.stop();
            if(wakeLock) wakeLock.release();
            stopBtn.classList.add('hidden');
            startBtn.classList.remove('hidden');
            document.getElementById('recording-status').classList.add('hidden');
            clearInterval(timerInterval);
        };

        recognition.onresult = (e) => {
            let interim = "";
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript + " ";
                else interim += e.results[i][0].transcript;
            }
            output.value = finalTranscript + interim;
            output.scrollTop = output.scrollHeight;
        };

        recognition.onend = () => { if(isRecording) recognition.start(); };

        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const h = Math.floor(elapsed / 3600000).toString().padStart(2,'0');
            const m = Math.floor((elapsed % 3600000) / 60000).toString().padStart(2,'0');
            const s = Math.floor((elapsed % 60000) / 1000).toString().padStart(2,'0');
            timerBox.innerText = `${h}:${m}:${s}`;
        }

        function saveToDB(blob) {
            const id = Date.now();
            const tx = db.transaction("sessions", "readwrite");
            tx.objectStore("sessions").add({ id, title: sessionTitle.value || "Untitled", date: new Date().toLocaleString(), text: output.value, media: blob });
        }

        function switchTab(tab) {
            document.getElementById('view-editor').classList.toggle('hidden', tab !== 'editor');
            document.getElementById('view-archives').classList.toggle('hidden', tab !== 'archives');
            document.getElementById('nav-editor').classList.toggle('btn-active', tab === 'editor');
            document.getElementById('nav-archives').classList.toggle('btn-active', tab === 'archives');
            if(tab === 'archives') loadArchives();
        }

        function loadArchives() {
            const list = document.getElementById('library-list');
            list.innerHTML = "";
            db.transaction("sessions", "readonly").objectStore("sessions").openCursor(null, 'prev').onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                    const doc = cursor.value;
                    const div = document.createElement('div');
                    div.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-3";
                    div.innerHTML = `<p class="text-[10px] text-indigo-500 font-bold uppercase">${doc.date}</p>
                                     <h3 class="font-bold text-slate-800 mb-3">${doc.title}</h3>
                                     <div class="flex gap-2">
                                        <button onclick="openEditor(${doc.id})" class="flex-1 bg-slate-100 py-2 rounded-lg text-xs font-bold">VIEW</button>
                                        <button onclick="deleteDoc(${doc.id})" class="px-4 text-red-500"><i class="fas fa-trash"></i></button>
                                     </div>`;
                    list.appendChild(div);
                    cursor.continue();
                }
            };
        }

        function openEditor(id) {
            db.transaction("sessions", "readonly").objectStore("sessions").get(id).onsuccess = (e) => {
                const doc = e.target.result;
                output.value = doc.text; sessionTitle.value = doc.title; switchTab('editor');
            };
        }

        function cleanupText() {
            output.value = output.value.replace(/\b(uhm|ah|parang|ano|so|yung|like)\b/gi, "").replace(/\s\s+/g, ' ').trim();
            finalTranscript = output.value;
        }

        async function generateMoMSummary() {
            const template = `--- MINUTES OF MEETING ---\nTITLE: ${sessionTitle.value}\nDATE: ${new Date().toLocaleDateString()}\n\n1. KEY DECISIONS:\n\n2. ACTION ITEMS (Who/What/When):\n\n--- TRANSCRIPT BELOW ---\n\n`;
            output.value = template + output.value;
        }

        function deleteDoc(id) { if(confirm("Delete this archive?")) { db.transaction("sessions","readwrite").objectStore("sessions").delete(id).oncomplete = loadArchives; } }
    </script>
</body>
</html>
